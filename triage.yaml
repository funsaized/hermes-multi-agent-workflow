# ===========================================================================
# AI Engineering Skills Map research and curriculum pipeline
#
# Domain policy lives here and in the Markdown files referenced below. The
# generic engine remains topic-agnostic. This pipeline discovers evidence-backed
# learning gaps for SOFTWARE ENGINEERS, maps them to Andrew Ng's four AI
# Engineering Skills Map topics, researches the gap, chooses the smallest useful
# learning format, pauses at one Discord gate, then produces a reviewed artifact.
#
# A triaged item is NOT a broad topic such as "RAG". It is a narrow transition:
#   observable current capability -> observable target capability
# Example: "can build basic RAG" -> "can separate retrieval and generation errors".
#
# Validate after editing:  .venv/Scripts/python -m cli.triage validate
# ===========================================================================

name: ai-engineering-skills-map
# Stable runtime namespace. Skills, cron jobs, gate references, and retry keys
# derive from this value so another triage can share the same Hermes profiles.
pipeline_id: ai-engineering
board: ai-engineering-learning
workspace_root: ./work

# Soft/manual reporting threshold only. The current engine does not enforce it.
cost_gate_usd: 10

# ---------------------------------------------------------------------------
# HERMES DEPLOYMENT
#
# Keep the existing default profile as the sole dispatcher and Discord gateway.
# One webresearch profile owns all four scheduled scouts; separate skills and
# queries give them distinct source contracts without needless profile sprawl.
# Roles remain semantically distinct even when two map to the same profile.
# ---------------------------------------------------------------------------
hermes:
  min_version: "0.20.0"
  base_profile: default
  gateway_profile: default
  project_root: .
  profile_strategy: clone
  # Cap live provider calls while preserving the board's queued fan-out.
  max_spawn: 3
  profiles:
    default:
      shared: true
      description: "Owns Skills Map triage state, routing, delivery, and the Discord human gate."
      # Dispatched Kanban workers receive kanban_* tools automatically from
      # HERMES_KANBAN_TASK; `kanban` is not an advertised Hermes 0.20.4 toolset.
      toolsets: [file, terminal]
    webresearch:
      shared: true
      description: "Runs source-specific Skills Map scouts on profile-local cron."
      # This workstation intentionally has no startup service for this profile.
      # Start a discovery window manually with: hermes -p webresearch gateway run
      # Cron starts outside a Kanban task, so scouts use terminal to call the
      # supported `hermes kanban` CLI when creating the first intake card.
      toolsets: [web, file, terminal]
      owns_cron: true
    researcher:
      shared: true
      description: "Performs verified research lanes and structured evidence handoffs."
      toolsets: [web, file]
    analyst:
      shared: true
      description: "Maps capabilities, learner states, assessments, and curriculum structure."
      toolsets: [web, file]
    author:
      shared: true
      description: "Writes approved briefs, explainers, and course content."
      toolsets: [web, file]
    builder:
      shared: true
      description: "Builds approved local labs and adaptive curriculum navigators."
      toolsets: [file, terminal, code_execution]
    reviewer:
      shared: true
      description: "Independently verifies claims, learning arcs, and runnable artifacts."
      toolsets: [web, file, terminal]

# ---------------------------------------------------------------------------
# SOURCES / SCOUT TYPES
#
# Scouts detect only: they do not dedup, score, or route. Each query requires a
# narrow capability gap, source URLs, and a mapping to the shared taxonomy in
# domain/ai-engineering-skills-map.md. Start live operation with `authoritative`
# only; resume other crons after one complete synthetic and one real cycle.
# ---------------------------------------------------------------------------
sources:
  - id: authoritative
    profile: webresearch
    skill: skills-map-scout-authoritative
    schedule: "15 8 * * 1,4"
    query: |
      Search official documentation, technical reports, standards, and primary
      research for consequential changes in AI engineering practice that create
      a learning need for software engineers. Map each candidate to exactly one
      primary Skills Map topic and named subskills from
      domain/ai-engineering-skills-map.md. Capture an observable current
      capability, observable target capability, primary URLs, retrieval dates,
      and why existing learning material may be insufficient. Skip product
      announcements without an engineering or learning implication.

  - id: practitioner
    profile: webresearch
    skill: skills-map-scout-practitioner
    schedule: "45 8 * * 2,5"
    query: |
      Search public engineering blogs, technical conference material,
      postmortems, and substantial open-source projects for demonstrated AI
      engineering practices, tradeoffs, and failure lessons. Prefer measured or
      reproducible evidence over opinion. Express each find as a narrow current-
      to-target capability gap for software engineers and map it to the shared
      Skills Map taxonomy.

  - id: community
    profile: webresearch
    skill: skills-map-scout-community
    schedule: "15 9 * * 3,6"
    query: |
      Search developer forums, GitHub issues, Reddit, and other public technical
      discussions for recurring AI engineering learning gaps. Require multiple
      independent reports or one unusually detailed, source-backed account.
      Record the observed failure, learner profile, current and target
      capabilities, relevant Skills Map nodes, and primary URLs. Skip vague hype,
      engagement bait, and isolated complaints.

  - id: job_market
    profile: webresearch
    skill: skills-map-scout-job-market
    schedule: "45 9 * * 0"
    query: |
      Search public job descriptions, competency frameworks, and hiring guidance
      for recurring AI engineering capabilities expected of software engineers.
      Extract transferable skills rather than employer-specific tools. Map each
      candidate to the shared taxonomy and identify evidence of a gap between
      expected performance and available learning material.

# ---------------------------------------------------------------------------
# ITEM CONTRACT
#
# This list documents the desired candidate model. The current intake parser is
# fixed to title, claim, sources, and why_it_may_matter. Scouts therefore encode
# the additional labeled fields inside `Why it may matter` until the parser is
# generalized; do not pretend these fields are independently validated today.
# ---------------------------------------------------------------------------
item_schema:
  fields:
    - title
    - claim
    - sources
    - why_it_may_matter
    - primary_skill
    - subskills
    - learner_profile
    - assumed_current_capability
    - target_capability
    - observed_failure
    - prerequisite_hypotheses
    - evidence_type
    - existing_learning_gap

# Token cosine is the only implemented dedup backend. These colder thresholds
# suit lexical comparison; `embedding` is not wired despite being accepted.
dedup:
  method: token-cosine
  duplicate_threshold: 0.62
  possible_threshold: 0.40

# ---------------------------------------------------------------------------
# VALUE RUBRIC (100 points; LLM judgment, deterministic validation)
#
# Advance at 70. Popularity alone cannot pass: the item must describe a useful,
# assessable learning transition supported by evidence. The old deterministic
# heuristic knows the example-domain keys and is intentionally not used here.
# ---------------------------------------------------------------------------
rubric:
  threshold: 70
  dimensions:
    - key: engineering_importance
      max: 20
      hint: "consequence for designing, building, evaluating, deploying, or safely operating AI-enabled software"
    - key: evidence_strength
      max: 15
      hint: "quality, independence, recency, and provenance of evidence; label vendor-reported results"
    - key: learning_gap
      max: 15
      hint: "extent to which current resources omit prerequisites, practice, feedback, error analysis, or a coherent learning arc"
    - key: target_capability_clarity
      max: 15
      hint: "whether the outcome is an observable engineering behavior rather than broad familiarity"
    - key: dependency_mappability
      max: 10
      hint: "whether the current-to-target transition can be represented as a defensible prerequisite graph"
    - key: assessment_quality
      max: 10
      hint: "whether understanding can be tested through reasoning, prediction, implementation, debugging, or measurement"
    - key: artifact_actionability
      max: 10
      hint: "whether a bounded brief, explainer, lab, course, or adaptive curriculum can close the gap"
    - key: skills_map_alignment
      max: 5
      hint: "strength of mapping to one primary Skills Map topic and named subskills"

# ---------------------------------------------------------------------------
# RESEARCH FAN-OUT
#
# `guide` is a generic optional mechanism: the engine inlines the reviewed file
# into every lane card so a lane name becomes an explicit evidence/output
# contract. Five evidence lanes run in parallel; the classifier waits for all
# five and emits the `recommended_format` value consumed by the route map.
# ---------------------------------------------------------------------------
research_lanes:
  role: researcher
  guide: paths/specs/research-lanes.md
  lanes:
    - verify_sources
    - map_skill_dependencies
    - model_target_learner
    - audit_existing_learning
    - design_assessment
    - recommend_learning_format
  classifier_lane: recommend_learning_format

route:
  classifier: recommend_learning_format.recommended_format
  map:
    focused_knowledge_gap: research_brief
    conceptual_model_gap: explainer
    applied_skill_gap: hands_on_lab
    broad_dependency_gap: full_course
    learner_variability_high: adaptive_curriculum
    already_covered: shelve
    insufficient_evidence: shelve

# ---------------------------------------------------------------------------
# FULFILLMENT PATHS
#
# Prep happens before the single human gate. Fulfillment happens only after an
# explicit approval and shares one persistent per-item directory. Every artifact
# path ends with independent review before the orchestrator performs delivery.
# The engine has no correction loop: a failed review must block honestly.
# ---------------------------------------------------------------------------
paths:
  research_brief:
    prep:
      - { stage: define_learning_transition, role: curriculum_analyst }
      - { stage: synthesize_verified_evidence, role: curriculum_analyst }
    propose: { role: orchestrator, template: paths/proposals/research-brief.md }
    fulfill:
      - { stage: draft_brief, role: content_author }
      - { stage: verify_brief, role: reviewer }
      - { stage: final_delivery, role: orchestrator }
    workspace_subdir: research-briefs
    scope_rails: paths/rails/research-brief.md
    deliverable_spec: paths/specs/research-brief.md

  explainer:
    prep:
      - { stage: identify_blocking_mental_model, role: curriculum_analyst }
      - { stage: design_explanation_arc, role: content_author }
    propose: { role: orchestrator, template: paths/proposals/explainer.md }
    fulfill:
      - { stage: write_explainer, role: content_author }
      - { stage: create_visuals, role: visual_author }
      - { stage: verify_explainer, role: reviewer }
      - { stage: final_delivery, role: orchestrator }
    workspace_subdir: explainers
    scope_rails: paths/rails/explainer.md
    deliverable_spec: paths/specs/explainer.md

  hands_on_lab:
    prep:
      - { stage: define_learning_transition, role: curriculum_analyst }
      - { stage: design_diagnostic, role: assessment_designer }
      - { stage: design_lab_sequence, role: lab_builder }
    propose: { role: orchestrator, template: paths/proposals/hands-on-lab.md }
    fulfill:
      - { stage: build_lab, role: lab_builder }
      - { stage: run_completion_test, role: reviewer }
      - { stage: review_learning_arc, role: assessment_designer }
      - { stage: final_delivery, role: orchestrator }
    workspace_subdir: hands-on-labs
    scope_rails: paths/rails/hands-on-lab.md
    deliverable_spec: paths/specs/hands-on-lab.md

  full_course:
    prep:
      - { stage: define_course_outcomes, role: curriculum_analyst }
      - { stage: build_dependency_graph, role: curriculum_analyst }
      - { stage: design_assessment_plan, role: assessment_designer }
      - { stage: outline_modules, role: course_author }
    propose: { role: orchestrator, template: paths/proposals/full-course.md }
    fulfill:
      - { stage: write_course, role: course_author }
      - { stage: build_course_labs, role: lab_builder }
      - { stage: validate_dependency_coverage, role: reviewer }
      - { stage: run_course_artifacts, role: reviewer }
      - { stage: final_delivery, role: orchestrator }
    workspace_subdir: courses
    scope_rails: paths/rails/full-course.md
    deliverable_spec: paths/specs/full-course.md

  adaptive_curriculum:
    prep:
      - { stage: define_learner_variants, role: curriculum_analyst }
      - { stage: build_capability_graph, role: curriculum_analyst }
      - { stage: design_diagnostic_bank, role: assessment_designer }
      - { stage: define_branching_policy, role: assessment_designer }
    propose: { role: orchestrator, template: paths/proposals/adaptive-curriculum.md }
    fulfill:
      - { stage: build_curriculum_content, role: course_author }
      - { stage: build_curriculum_navigator, role: lab_builder }
      - { stage: simulate_learner_paths, role: reviewer }
      - { stage: final_delivery, role: orchestrator }
    workspace_subdir: adaptive-curricula
    scope_rails: paths/rails/adaptive-curriculum.md
    deliverable_spec: paths/specs/adaptive-curriculum.md

  shelve:
    auto: true

# Abstract roles keep path intent readable. Several deliberately share a profile;
# split them only when different models, credentials, or toolsets are necessary.
roles:
  orchestrator: default
  researcher: researcher
  curriculum_analyst: analyst
  assessment_designer: analyst
  content_author: author
  course_author: author
  visual_author: author
  lab_builder: builder
  reviewer: reviewer

# Preserve the existing Discord definition. Replies are ordinary text; a leading
# slash would invoke Hermes command approval rather than this proposal gate.
gate:
  channel: discord
  target: discord:1484142557704491119
  approve: [approve]
  shelve: [shelve, "reject the rest"]
  modify: [modify]
